# Building blocks: one pinned module per concern, shipped in the `standard-blocks` package (blocks/python/), and the
# raw APIs product code may not touch outside it. A rule a block absorbs holds when the block is used, its hash is the
# pinned one and no banned API appears in product code: one scanner fact, `blocks = used`.
#
# Ban patterns (checked on the syntax tree, never on text):
#   import:M                 importing module M (or from M)
#   call:Q                   calling the qualified name Q (imports resolved: `from os import system` counts)
#   call-kw:Q:K=V            calling Q with keyword K set to the literal V
#   call-dyn:NAME:I          calling any function or method named NAME whose argument I is not a string literal
#   builtin:N                calling the builtin N
#   attr-set:A               assigning attribute A (JS: innerHTML…)
#   js-call:Q / js-import:M  the same for JavaScript (lot 9)

[block.web]
module = "standard_blocks.web"
does = "security headers (CSP from @csp_sources, HSTS, nosniff, Referrer-Policy, COOP, frame-ancestors), cookie flags (__Host-, Secure, HttpOnly, SameSite), CSRF for cookie sessions, CORS from @origins, HTTPS redirect for pages only, allowed methods (no TRACE), generic error pages, no server banner, no-store on authenticated responses, forwarded headers only from @trusted_proxies, redirects only to @redirect_targets, rate limits from @rate_per_minute"
use = "app = secure_app(FastAPI(), rules)"
bans = ["call:starlette.responses.RedirectResponse", "call:fastapi.responses.RedirectResponse", "call:fastapi.middleware.cors.CORSMiddleware", "call:starlette.middleware.cors.CORSMiddleware"]
probes = ["headers", "cookies", "cors", "csrf", "methods", "errors", "https-redirect", "no-store", "redirects", "rate-limit", "param-pollution"]

[block.render]
module = "standard_blocks.render"
does = "auto-escaping templates, one sanitiser for HTML/SVG/Markdown from users, a URL builder that encodes every part and allows only http(s)"
use = "render('page.html', user=user) · clean_html(text) · url(base, 'orders', oid, q=term)"
bans = ["call:markupsafe.Markup", "call:jinja2.Template", "call:jinja2.Environment.from_string", "call:django.utils.safestring.mark_safe", "call:starlette.responses.HTMLResponse"]
probes = []

[block.input]
module = "standard_blocks.input"
does = "every body and query goes through a declared Pydantic model: strict types, extra fields refused, decoding once, allow-lists as Literal or constrained types"
use = "class OrderIn(Input): quantity: conint(ge=1, le=@max)"
bans = ["call-dyn:json:0", "call:starlette.requests.Request.json", "call:starlette.requests.Request.form", "call:starlette.requests.Request.body"]
probes = ["unknown-field"]

[block.data]
module = "standard_blocks.data"
does = "SQLAlchemy ORM and bound parameters only; queries on owned models are filtered by owner and tenant by default"
use = "owned(select(Order), user).where(Order.id == oid)"
bans = ["call-dyn:execute:0", "call-dyn:executemany:0", "call-dyn:executescript:0", "call-dyn:text:0", "call-dyn:raw:0"]
probes = ["idor"]

[block.outbound]
module = "standard_blocks.outbound"
does = "one HTTP client: destinations only from @destinations, timeout @outbound_timeout_s, no redirect to another host, certificates checked, telemetry on every call"
use = "await outbound.get('billing', '/invoices', params={'id': iid})"
bans = ["import:requests", "import:urllib.request", "import:urllib3", "import:http.client", "import:aiohttp", "call:httpx.get", "call:httpx.post", "call:httpx.Client", "call:httpx.AsyncClient", "call-kw:*:verify=False"]
probes = ["egress"]

[block.crypto]
module = "standard_blocks.crypto"
does = "SHA-256/512 and HMAC, AES-256-GCM with fresh 96-bit nonces, random tokens from secrets (>= 128 bits), constant-time comparison, Argon2id or scrypt for anything password-like, algorithm names from configuration"
use = "seal(key, data) · open_(key, box) · token() · same(a, b) · digest(data)"
bans = ["call:hashlib.md5", "call:hashlib.sha1", "call-kw:hashlib.new:name=md5", "import:random", "import:Crypto", "import:Cryptodome", "call:cryptography.hazmat.primitives.ciphers.modes.ECB", "call:cryptography.hazmat.primitives.ciphers.modes.CBC", "import:cryptography.hazmat.primitives.ciphers"]
probes = []

[block.files]
module = "standard_blocks.files"
does = "uploads checked against @upload_max_bytes, @upload_types by real content, @image_max_pixels, @user_quota_bytes; archives against @unpacked_max_bytes and @archive_max_files, without symlinks or paths; stored by generated id outside the web root, never executable; downloads with a safe Content-Disposition; image metadata stripped"
use = "fid = await receive(upload, owner=user) · return serve(fid, as_name='report.pdf')"
bans = ["call:zipfile.ZipFile.extractall", "call:tarfile.TarFile.extractall", "call:shutil.unpack_archive", "call:starlette.responses.FileResponse", "call:fastapi.responses.FileResponse", "call-dyn:open:0"]
probes = ["upload-limits", "upload-type", "zip-slip"]

[block.parse]
module = "standard_blocks.parse"
does = "defused XML, JSON for untrusted data, safe YAML, length-bounded regex on input with no nested quantifiers, CSV cells escaped against formulas, LDAP and XPath values escaped"
use = "xml(text) · yaml(text) · csv_row(cells) · search(pattern, text)"
bans = ["import:pickle", "import:marshal", "import:shelve", "call:yaml.load", "call:yaml.unsafe_load", "import:xml.etree.ElementTree", "import:xml.dom.minidom", "import:xml.sax", "import:lxml.etree", "call-dyn:re.compile:0", "call:csv.writer"]
probes = []

[block.process]
module = "standard_blocks.process"
does = "processes started with an argument list, a fixed executable, no shell, a timeout"
use = "run(['convert', src, dst], timeout=30)"
bans = ["call:os.system", "call:os.popen", "call-kw:subprocess.run:shell=True", "call-kw:subprocess.Popen:shell=True", "call-kw:subprocess.call:shell=True", "call-kw:subprocess.check_output:shell=True", "call:commands.getoutput"]
probes = []

[block.session]
module = "standard_blocks.session"
does = "OpenID Connect relying party (code flow with PKCE, state and nonce, issuer and audience checked, ID token verified); the app's own session: 128-bit random id rotated at sign-in, idle @session_idle_min and absolute @session_max_hours, ended on logout everywhere, re-authentication before @sensitive_actions, security events logged"
use = "user: User = Depends(current_user)"
bans = ["import:jwt", "import:jose", "import:authlib", "import:itsdangerous", "call:starlette.middleware.sessions.SessionMiddleware"]
probes = ["session-rotation", "session-timeout", "logout", "reauth", "oidc-flow"]

[block.access]
module = "standard_blocks.access"
does = "every route declares its id; the dependency reads @access fresh on each call; a route not in @access is admin-only; @critical routes refuse unauthenticated calls; response models filter fields by role"
use = "@app.get('/orders/{oid}', dependencies=[allow('orders.read')])"
bans = []
probes = ["access-matrix", "unauthenticated"]

[block.log]
module = "standard_blocks.log"
does = "structured JSON logs in UTC with who/what/where/outcome, @sensitive fields and secret patterns redacted, values encoded against log injection, security events emitted by session and access"
use = "log.event('order.cancelled', order=oid, outcome='ok')"
bans = ["builtin:print", "call:logging.basicConfig"]
probes = ["log-redaction"]

[block.runtime]
module = "standard_blocks.runtime"
does = "health endpoint, clean SIGTERM shutdown, settings from the environment, secrets from a vault by reference, bounded queues and pools (@queue_max), a last-resort error handler, OpenTelemetry spans and metrics with standard names, debug off in production"
use = "settings = load(Settings) · key = secret('billing-key') · q = bounded_queue()"
bans = ["call-kw:uvicorn.run:reload=True", "call-kw:*:debug=True", "call:queue.Queue", "call:asyncio.Queue"]
probes = ["health", "shutdown", "no-debug", "telemetry"]

[block.idp]
module = "(identity provider configuration)"
does = "the identity provider (Keycloak first) configured by Standard: password policy (@password_min, breached list, no composition rules, no rotation), brute-force protection, MFA for @mfa, resets that keep MFA, OTP rules, no secret questions, uniform login errors, notifications on credential changes, factors revocable"
use = "standard idp apply realm.json"
bans = []
probes = ["idp-password-policy", "idp-brute-force", "idp-mfa", "idp-reset", "idp-enumeration"]

[block.front]
module = "standard_blocks/front (JS, lot 9)"
does = "pinned assets with integrity, postMessage helper checking origin and shape, storage helper refusing @sensitive fields, lint rules: no DOM clobbering, no prototype pollution, strict equality"
use = "import { listen } from '@standard/front'"
bans = ["js-call:window.addEventListener:message", "attr-set:innerHTML", "attr-set:outerHTML", "js-call:document.write"]
probes = ["sri"]

[block.pipeline]
module = "(Standard's instruments)"
does = "deploys without .git, dependencies from the expected registry locked with hashes, migrations with a reverse step, TLS and directory-listing probes on the running product"
use = "(nothing to call: Standard runs it)"
bans = []
probes = ["no-vcs", "tls", "dir-listing", "migrations-reversible", "lock-hashes"]

[block.bans]
module = "(ban list only)"
does = "APIs no product code may call"
use = "(nothing to call)"
bans = ["builtin:eval", "builtin:exec", "builtin:compile", "builtin:__import__", "call:importlib.import_module", "call-dyn:getattr:1"]
probes = []
