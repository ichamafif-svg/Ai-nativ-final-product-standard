category = "Cryptography"

[[rule]]
id = "CRYPTO-LIB"
do = "Do every cryptographic operation through the crypto block."
never = "Your own cipher, padding, key derivation or random generator; XOR \"encryption\"."
applies = ["crypto"]
when = ["construct:cipher", "construct:hash"]
who = ["det", "ai"]
block = "crypto"
absorb = "full"
pass = "medium"
phase = "build"
check = ["blocks", "patrol"]
asvs = ["11.2.1"]
cwe = ["327"]

[[rule]]
id = "CRYPTO-AGILITY"
do = "Name algorithms in configuration through the crypto block, so they can change without code changes."
never = "An algorithm name hard-coded in several places."
applies = ["crypto"]
when = ["construct:cipher", "construct:hash"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "wide"
phase = "build"
check = ["blocks"]
asvs = ["11.2.2"]
cwe = []

[[rule]]
id = "CRYPTO-STRENGTH"
do = "128-bit security at least: AES-256, Ed25519 or P-256 and up, RSA 3072 and up, approved key exchange."
never = "RSA 1024, DES, 3DES, RC4, a 64-bit key."
applies = ["crypto"]
when = ["construct:cipher"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "fine"
phase = "build"
check = ["blocks", "bandit:B505"]
asvs = ["11.2.3", "11.6.1", "11.6.2"]
cwe = ["326"]

[[rule]]
id = "CONST-TIME"
do = "Compare secrets, tokens and MACs with same()."
never = "== or != on secrets."
applies = []
when = ["construct:secret-compare"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "fine"
phase = "build"
check = ["blocks", "semgrep:standard.secret-compare"]
asvs = ["11.2.4"]
cwe = ["208"]
py_ok = '''if same(given, expected): ...'''
py_no = '''if given == expected: ...'''

[[rule]]
id = "CRYPTO-FAIL"
do = "When decryption or verification fails, fail closed with one generic error."
never = "Different errors for bad padding and bad MAC; continuing with unverified data."
applies = ["crypto"]
when = ["construct:cipher"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "medium"
phase = "build"
check = ["blocks"]
asvs = ["11.2.5"]
cwe = ["209"]

[[rule]]
id = "CIPHER"
do = "Encrypt with seal() (AES-256-GCM, authenticated)."
never = "ECB, CBC without a MAC, PKCS#1 v1.5 padding."
applies = ["crypto"]
when = ["construct:cipher"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "fine"
phase = "build"
check = ["blocks", "bandit:B304", "bandit:B305"]
asvs = ["11.3.1", "11.3.2", "11.3.3", "11.3.5"]
cwe = ["327"]
py_ok = '''box = seal(key, data)'''
py_no = '''Cipher(algorithms.AES(key), modes.ECB())'''

[[rule]]
id = "NONCE"
do = "Let seal() draw a fresh nonce for every message."
never = "A fixed, counted or reused nonce or IV."
applies = ["crypto"]
when = ["construct:cipher"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "fine"
phase = "build"
check = ["blocks"]
asvs = ["11.3.4"]
cwe = ["323"]

[[rule]]
id = "HASH"
do = "Hash with digest() (SHA-256 or stronger) and MAC with mac()."
never = "MD5 or SHA-1 for anything security-related."
applies = []
when = ["construct:hash"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "fine"
phase = "build"
check = ["blocks", "bandit:B303", "bandit:B324"]
asvs = ["11.4.1", "11.4.3"]
cwe = ["328"]
py_ok = '''fingerprint = digest(data)'''
py_no = '''hashlib.md5(data).hexdigest()'''

[[rule]]
id = "PWD-HASH"
do = "Store anything password-like (API keys, recovery codes) with derive() (Argon2id or scrypt)."
never = "A plain hash or no hash for a secret users type or hold."
applies = ["crypto"]
when = ["construct:hash"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "fine"
phase = "build"
check = ["blocks"]
asvs = ["11.4.2", "11.4.4"]
cwe = ["916"]

[[rule]]
id = "CSPRNG"
do = "Generate anything that must not be guessed with token() or the secrets module."
never = "random, uuid1, time or a counter for tokens, ids or codes."
applies = []
when = ["construct:random"]
who = ["det"]
block = "crypto"
absorb = "full"
pass = "fine"
phase = "build"
check = ["blocks", "bandit:B311"]
asvs = ["11.5.1", "11.5.2"]
cwe = ["330", "338"]
py_ok = '''invite = token()'''
py_no = '''invite = str(random.randint(0, 10**8))'''
