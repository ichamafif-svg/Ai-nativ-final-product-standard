category = "Configuration and secrets"

[[rule]]
id = "SERVICE-CONFIG"
do = "Call each external service with the settings declared for it in outbound (timeout, pool, retries)."
never = "Connection settings repeated by hand at each call."
applies = ["outbound-http"]
when = ["surface:outbound-call"]
who = ["det"]
block = "outbound"
absorb = "full"
pass = "medium"
phase = "build"
check = ["blocks"]
asvs = ["13.2.6"]
cwe = []

[[rule]]
id = "SECRETS-MGMT"
do = "Read secrets with secret(name) from the vault; the environment holds only a reference."
never = "A secret in code, in the repository or in an environment dump."
applies = []
when = ["construct:env-read", "surface:config"]
who = ["human", "det"]
block = "runtime"
absorb = "partial"
pass = "medium"
phase = "run"
check = ["blocks", "bandit:B105", "human"]
asvs = ["13.3.1", "13.3.2", "13.3.4"]
cwe = ["798", "522"]
py_ok = '''key = secret("billing-key")'''
py_no = '''KEY = "sk_live_51H..."'''

[[rule]]
id = "NO-VCS"
do = "Deploy without .git, .svn or any repository metadata."
never = "Copy the repository folder as the release."
applies = ["api"]
when = []
who = ["det"]
block = "pipeline"
absorb = "full"
pass = "medium"
phase = "run"
check = ["probe:no-vcs"]
asvs = ["13.4.1"]
cwe = ["527"]

[[rule]]
id = "NO-DEBUG"
do = "Run without debug or reload in production; the runtime block refuses to start otherwise."
never = "debug=True, reload=True, a debug toolbar outside development."
applies = []
when = ["construct:debug-flag"]
who = ["det"]
block = "runtime"
absorb = "full"
pass = "fine"
phase = "build"
check = ["blocks", "bandit:B201", "probe:no-debug"]
asvs = ["13.4.2"]
cwe = ["489"]

[[rule]]
id = "NO-DIR-LIST"
do = "Serve no directory listings."
never = "StaticFiles(html=False) on a folder with an index of files; autoindex on."
applies = ["web"]
when = []
who = ["det"]
block = "pipeline"
absorb = "full"
pass = "medium"
phase = "run"
check = ["probe:dir-listing"]
asvs = ["13.4.3"]
cwe = ["548"]

[[rule]]
id = "NO-EXPOSED-DOCS"
do = "Expose API docs, metrics and admin endpoints only if listed in @public; everything else needs a signed-in admin."
never = "/docs, /metrics or /openapi.json open to the world by default."
applies = ["api"]
when = ["surface:endpoint"]
who = ["det", "human"]
block = "web"
absorb = "partial"
pass = "medium"
phase = "run"
values = ["public"]
check = ["blocks", "probe:unauthenticated"]
asvs = ["13.4.5", "15.2.3"]
cwe = ["200"]

[[rule]]
id = "NO-VERSION-LEAK"
do = "Send no version of the server, framework or backend in headers or errors."
never = "Server: uvicorn/0.30; X-Powered-By."
applies = ["api"]
when = []
who = ["det"]
block = "web"
absorb = "full"
pass = "medium"
phase = "run"
check = ["blocks", "probe:headers"]
asvs = ["13.4.6"]
cwe = ["200"]
