category = "Transport"

[[rule]]
id = "TLS-SERVER"
do = "Serve TLS 1.2 or 1.3 only, recommended suites, a publicly trusted certificate, no plain-HTTP fallback."
never = "TLS 1.0 or 1.1; a self-signed certificate facing users."
applies = ["api"]
when = []
who = ["det"]
block = "pipeline"
absorb = "full"
phase = "run"
check = ["probe:tls"]
asvs = ["12.1.1", "12.1.2", "12.2.1", "12.2.2"]
cwe = ["319", "326"]

[[rule]]
id = "TLS-INTERNAL"
do = "Encrypt every internal and outbound connection with TLS and trusted certificates."
never = "Plain connections between services, to the database or the cache."
applies = []
when = ["surface:config", "surface:outbound-call"]
who = ["human", "det", "ai"]
block = ""
absorb = "none"
phase = "run"
check = ["human", "patrol"]
asvs = ["12.3.1", "12.3.3", "12.3.4"]
cwe = ["319"]

[[rule]]
id = "TLS-VERIFY"
do = "Check certificates on every outgoing TLS connection."
never = "verify=False, CERT_NONE, check_hostname=False."
applies = []
when = ["construct:tls-context", "construct:http-client"]
who = ["det"]
block = "outbound"
absorb = "full"
phase = "build"
check = ["blocks", "bandit:B501"]
asvs = ["12.3.2"]
cwe = ["295"]
py_ok = '''await outbound.get("billing", "/status")'''
py_no = '''httpx.get(url, verify=False)'''

[[rule]]
id = "MTLS"
do = "Check a client certificate against the trusted chain before using its identity."
never = "Read the identity from a certificate that was not validated."
applies = ["mtls"]
when = ["construct:tls-context"]
who = ["det"]
block = "web"
absorb = "partial"
phase = "build"
check = ["blocks", "test:mtls"]
asvs = ["12.1.3"]
cwe = ["295"]

[[rule]]
id = "SERVICE-AUTH"
do = "Services authenticate each other with their own identity and only the rights they need."
never = "One shared credential for every service; an internal API open to the network."
applies = []
when = ["surface:outbound-call", "surface:config"]
who = ["human", "ai"]
block = ""
absorb = "none"
phase = "run"
check = ["human", "patrol"]
asvs = ["12.3.5", "13.2.1", "13.2.2"]
cwe = ["306"]
