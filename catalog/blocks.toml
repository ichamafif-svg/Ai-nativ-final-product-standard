use = "ring.seal(data) \u00b7 ring.open(box) \u00b7 sign_token(key, 'email', data, 3600) \u00b7 token() \u00b7 same(a, b)"
bans = ["call:hashlib.md5", "call:hashlib.sha1", "call-kw:hashlib.new:name=md5", "import:random", "import:Crypto", "import:Cryptodome", "call:cryptography.hazmat.primitives.ciphers.modes.ECB", "call:cryptography.hazmat.primitives.ciphers.modes.CBC", "import:cryptography.hazmat.primitives.ciphers"]

[block.files]
does = "uploads checked against @upload_max_bytes, @upload_types by real content, @image_max_pixels, @user_quota_bytes; archives against @unpacked_max_bytes and @archive_max_files, without symlinks or paths; stored by generated id outside the web root, never executable; downloads with a safe Content-Disposition; image metadata stripped; archives measured by decompressing (ratio and size), PDFs with active content refused, downloads sandboxed, no link followed"
probes = ["upload-limits", "upload-type", "zip-slip"]

