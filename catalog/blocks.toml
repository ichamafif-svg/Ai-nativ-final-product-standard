# Building blocks. Each block is one contract (what it guarantees: `does`, and the probes that prove it: `probes`)
# with Python primitives in [block.<name>.python], FastAPI integrations in [block.<name>.fastapi], and
# Next.js integrations in [block.<name>.nextjs]. FastAPI uses the Python implementation where there is no specific
# integration. Python implementations may depend on Pydantic, SQLAlchemy or Jinja; their optional ASGI helpers
# are named explicitly in `use`. Product code may not call, outside the block, what
# the block covers (`bans`, per stack). A rule a block absorbs holds when the product's stack has the block, uses it,
# and adds no banned API: one scanner fact, `blocks = clean`. A stack without the block keeps only its bans and probes.
#
# Ban patterns (checked on the syntax tree for Python, lexically for JavaScript, never on raw text):
#   import:M  call:Q  call-kw:Q:K=V  call-dyn:NAME:I  builtin:N         Python
#   js-import:M  js-call:Q[:first string argument]  js-word:W  attr-set:A   JavaScript / TypeScript

[block.web]
does = "security headers (CSP from @csp_sources, HSTS, nosniff, Referrer-Policy, COOP, frame-ancestors), cookie flags (__Host-, Secure, HttpOnly, SameSite), CSRF for cookie sessions, CORS from @origins, HTTPS redirect for pages only, allowed methods (no TRACE), generic error pages, no server banner, no-store on authenticated responses, forwarded headers only from @trusted_proxies, redirects only to @redirect_targets, rate limits from @rate_per_minute; bounded URL, headers, body (@body_max_bytes) and time to response (@request_timeout_s); JSON read once, strictly (@json_max_depth, no duplicate key); Fetch Metadata isolation of cross-site requests; only @hosts answered; Permissions-Policy, CORP, Trusted Types (@trusted_types); limits shared by every worker; product hooks that can only refuse"
probes = ["headers", "cookies", "cors", "csrf", "methods", "errors", "https-redirect", "no-store", "redirects", "rate-limit", "param-pollution"]

[block.web.fastapi]
module = "standard_blocks.web"
use = "app = secure_app(FastAPI(), rules)"
bans = ["call:starlette.responses.RedirectResponse", "call:fastapi.responses.RedirectResponse", "call:fastapi.middleware.cors.CORSMiddleware", "call:starlette.middleware.cors.CORSMiddleware"]

[block.web.nextjs]
module = "@standard/blocks/web"
use = "export const middleware = guard(values, NextResponse) \u00b7 headers: securityHeaders(values) in next.config"
bans = ["js-call:NextResponse.redirect", "js-call:Response.redirect", "js-call:cookies().set", "js-call:res.setHeader"]

[block.render]
does = "auto-escaping templates, one sanitiser for HTML/SVG/Markdown from users, a URL builder that encodes every part and allows only http(s); typed results (SafeHtml, TrustedUrl), sandboxed templates, json_for_script"
probes = []

[block.render.python]
module = "standard_blocks.render"
use = "clean_html(text) · url(base, 'orders', oid, q=term) · Pages('templates').render('page.html', user=user) returns a Starlette response"
bans = ["call:markupsafe.Markup", "call:jinja2.Template", "call:jinja2.Environment.from_string", "call:django.utils.safestring.mark_safe", "call:starlette.responses.HTMLResponse"]

[block.input]
does = "every body and query goes through a declared schema (Pydantic, Zod): strict types, extra fields refused, decoding once, allow-lists as literal or constrained types, a bounded body size; every value bounded, one Unicode form, invisible controls and bidi overrides refused, frozen after validation"
probes = ["unknown-field"]

[block.input.python]
module = "standard_blocks.input"
use = "class OrderIn(Input): item: Text[100]; quantity: Count"
bans = ["call-dyn:json:0", "call:starlette.requests.Request.json", "call:starlette.requests.Request.form", "call:starlette.requests.Request.body"]

[block.input.nextjs]
module = "@standard/blocks/input"
use = "const order = await body(request, OrderIn) \u00b7 OrderIn = z.object({...}).strict()"
bans = ["js-call:request.json", "js-call:req.json", "js-call:request.formData", "js-call:request.text"]

[block.data]
does = "SQLAlchemy ORM and bound parameters only; queries on owned models are filtered by owner and tenant by default; for_user(session, user) adds the filters to every ORM statement and stamps new rows; a model with neither column is refused unless declared shared"
probes = ["idor"]

[block.data.python]
module = "standard_blocks.data"
use = "db = for_user(Session(engine), user) \u00b7 owned(select(Order), user).where(Order.id == oid)"
bans = ["call-dyn:execute:0", "call-dyn:executemany:0", "call-dyn:executescript:0", "call-dyn:text:0", "call-dyn:raw:0"]

[block.outbound]
does = "one HTTP client: destinations only from @destinations, timeout @outbound_timeout_s, no redirect to another host, certificates checked, telemetry on every call; addresses checked at connection time on every resolved address (DNS rebinding), metadata and link-local refused, no proxy from the environment, responses bounded (@outbound_max_bytes), one deadline per call"
probes = ["egress"]

[block.outbound.python]
module = "standard_blocks.outbound"
use = "await outbound.get('billing', '/invoices', params={'id': iid}) · synchronous: request('GET', 'billing', endpoints=endpoints, values=rules)"
bans = ["import:requests", "import:urllib.request", "import:urllib3", "import:http.client", "import:aiohttp", "call:httpx.get", "call:httpx.post", "call:httpx.Client", "call:httpx.AsyncClient", "call-kw:*:verify=False"]

[block.crypto]
does = "SHA-256/512 and HMAC, AES-256-GCM with fresh 96-bit nonces, random tokens from secrets (>= 128 bits), constant-time comparison, Argon2id or scrypt for anything password-like, algorithm names from configuration; versioned outputs, key rotation (Keyring), a per-message key (HKDF) under AES-GCM, purpose-bound expiring tokens, stored hash parameters with needs_rehash"
probes = []

