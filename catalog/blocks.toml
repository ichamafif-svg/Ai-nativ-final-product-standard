[block.session]
does = "OpenID Connect relying party (code flow with PKCE, state and nonce, issuer and audience checked, ID token verified); the app's own session: 128-bit random id rotated at sign-in, idle @session_idle_min and absolute @session_max_hours, ended on logout everywhere, re-authentication before @sensitive_actions, security events logged; ids stored hashed in a shared store, sessions bound to their client, provider keys expiring hourly, embedded or foreign-kind tokens refused, @mfa checked on amr, back-channel logout"
probes = ["session-rotation", "session-timeout", "logout", "reauth", "oidc-flow"]

[block.session.fastapi]
module = "standard_blocks.session"
use = "oidc = Oidc(issuer, client_id, redirect_uri, rules).bind(app) · user: User = Depends(oidc.current_user)"
bans = ["import:jwt", "import:jose", "import:authlib", "import:itsdangerous", "call:starlette.middleware.sessions.SessionMiddleware"]

[block.session.nextjs]
module = "@standard/blocks/session"
use = "const oidc = createOidc(config, values) \u00b7 export const GET = oidc.login \u00b7 const user = await oidc.currentUser(request)"
bans = ["js-import:next-auth", "js-import:jsonwebtoken", "js-import:jose", "js-import:iron-session", "js-import:jwt-decode"]

[block.access]
does = "every route declares its id; the dependency reads @access fresh on each call; a route not in @access is admin-only; @critical routes refuse unauthenticated calls; response models filter fields by role; a route without an id stops the app in production; also= predicates that can only refuse"
probes = ["access-matrix", "unauthenticated", "field-uses"]

[block.access.fastapi]
module = "standard_blocks.access"
use = "access = Access(oidc.current_user, rules).bind(app) · @app.get('/orders/{oid}', dependencies=[Depends(access.allow('orders.read'))])"
bans = []

[block.access.nextjs]
module = "@standard/blocks/access"
use = "export const GET = access.route('orders.read', async (request, ctx, user) => \u2026) \u00b7 access.action('orders.cancel', fn)"
bans = []

[block.log]
does = "structured JSON logs in UTC with who/what/where/outcome, @sensitive fields and secret patterns redacted, values encoded against log injection, security events emitted by session and access; Secret redacted by type, more credential shapes, control and bidi characters neutralised, a hash chain over records"
probes = ["log-redaction"]

