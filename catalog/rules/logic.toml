category = "Input and business logic"

[[rule]]
id = "VALIDATE"
do = "Declare every body and query as an Input model: types, ranges, allowed values; reject anything else on the server."
never = "Read request.json() or a raw dict; rely on the browser's validation."
applies = ["api"]
when = ["construct:request-body", "surface:endpoint"]
who = ["det", "ai"]
block = "input"
absorb = "partial"
phase = "build"
check = ["blocks", "probe:unknown-field", "patrol"]
asvs = ["2.2.1", "2.2.2"]
cwe = ["20"]
py_ok = '''class TransferIn(Input):
    amount: condecimal(gt=0, le=10_000)
    currency: Literal["EUR", "USD"]'''
py_no = '''data = await request.json(); amount = data["amount"]'''

[[rule]]
id = "VALIDATE-COMBO"
do = "Check fields that depend on each other together, in the model's validator."
never = "Accept each field alone when their combination can be wrong (end before start, city outside its country)."
applies = ["api"]
when = ["construct:request-body"]
who = ["ai", "human"]
block = ""
absorb = "none"
phase = "build"
check = ["patrol"]
asvs = ["2.2.3"]
cwe = ["20"]
py_ok = '''@model_validator(mode="after")
def ordered(self):
    if self.end <= self.start: raise ValueError("end after start")
    return self'''

[[rule]]
id = "FLOW-ORDER"
do = "Store each multi-step flow's state on the server and refuse a step whose previous step is not done."
never = "Trust a step number, a hidden field or the URL to know where the user is."
applies = ["api"]
when = ["surface:endpoint"]
who = ["det", "ai"]
block = ""
absorb = "none"
phase = "build"
wire = ["test:flow-skip"]
check = ["test:flow-skip", "patrol"]
asvs = ["2.3.1"]
cwe = ["841"]

[[rule]]
id = "BIZ-LIMITS"
do = "Enforce the business limits on the server, per user and in total, with the numbers from the rules of the game."
never = "A limit only in the interface; a limit hard-coded in code instead of a named value."
applies = ["api"]
when = ["surface:endpoint"]
who = ["det", "human"]
block = ""
absorb = "none"
phase = "build"
wire = ["test:limit"]
check = ["test:limit"]
asvs = ["2.3.2"]
cwe = ["770"]

[[rule]]
id = "TRANSACTION"
do = "Run each business operation in one transaction: it commits whole or rolls back whole."
never = "Two writes of one operation in separate commits; a side effect (mail, payment) before the commit."
applies = ["database"]
when = ["construct:sql-call", "construct:lock"]
who = ["ai"]
block = ""
absorb = "none"
phase = "build"
check = ["patrol"]
asvs = ["2.3.3"]
cwe = ["662"]
py_ok = '''with session.begin():
    debit(a); credit(b)'''
py_no = '''debit(a); session.commit(); credit(b); session.commit()'''

[[rule]]
id = "LOCKING"
do = "Lock or use a conditional update when you check then act on a limited resource (seats, stock, balance)."
never = "Read, check in Python, then write: two requests pass the same check."
applies = ["database"]
when = ["construct:sql-call", "construct:lock"]
who = ["ai"]
block = ""
absorb = "none"
phase = "build"
check = ["patrol"]
asvs = ["2.3.4", "15.4.2"]
cwe = ["362", "367"]
py_ok = '''session.execute(update(Seat).where(Seat.id == sid, Seat.taken.is_(False)).values(taken=True))'''
py_no = '''seat = get(sid)
if not seat.taken: seat.taken = True'''

[[rule]]
id = "MULTI-APPROVAL"
do = "Operations listed in @high_value need a second person's approval before they run."
never = "Let one identity request and approve the same listed operation."
applies = ["high-value"]
when = ["surface:endpoint"]
who = ["human"]
block = ""
absorb = "none"
phase = "build"
team_only = true
values = ["high_value"]
check = ["human"]
asvs = ["2.3.5"]
cwe = []

[[rule]]
id = "ANTI-AUTOMATION"
do = "Rate-limit costly or sensitive routes at @rate_per_minute per caller, through the web block."
never = "An unbounded route that sends mail, creates accounts, exports data or calls a paid service."
applies = ["api"]
when = ["surface:endpoint"]
who = ["det", "human"]
block = "web"
absorb = "partial"
phase = "build"
values = ["rate_per_minute"]
check = ["blocks", "probe:rate-limit"]
asvs = ["2.4.1", "2.4.2"]
cwe = ["770", "799"]
