category = "Data protection"

[[rule]]
id = "DATA-MIN"
do = "Return and process only the fields the caller needs: one response model per use, never the stored object."
never = "return user; select * sent to the client."
applies = ["api"]
when = ["construct:response-model"]
who = ["ai", "human"]
block = ""
absorb = "none"
held_by = "code"
phase = "build"
values = ["sensitive"]
check = ["patrol"]
asvs = ["11.7.2", "14.2.6", "15.3.1"]
cwe = ["200", "213"]
py_ok = '''class OrderOut(Output):
    id: int
    status: str'''
py_no = '''return session.get(Order, oid)'''

[[rule]]
id = "NO-SECRETS-URL"
do = "Put tokens, keys and @sensitive fields in headers or bodies, never in URLs."
never = "?token=…, ?api_key=…, an e-mail in a path."
applies = ["api"]
when = ["construct:url-build", "surface:endpoint"]
who = ["det"]
block = "web"
absorb = "partial"
held_by = "code"
phase = "build"
values = ["sensitive"]
check = ["blocks", "semgrep:standard.secret-in-url"]
asvs = ["14.2.1"]
cwe = ["598"]

[[rule]]
id = "NO-CACHE-SENSITIVE"
do = "Mark authenticated and @sensitive responses Cache-Control: no-store; caches keep only public content of the expected type."
never = "A shared cache or CDN storing a signed-in page."
applies = ["api"]
when = ["surface:endpoint"]
who = ["det", "human"]
block = "web"
absorb = "full"
held_by = "platform:ingress"
phase = "run"
values = ["sensitive"]
check = ["blocks", "probe:no-store"]
asvs = ["14.2.2", "14.2.5", "14.3.2"]
cwe = ["524", "525"]

[[rule]]
id = "NO-TRACKERS"
do = "Pages send data only to @trackers; the CSP blocks every other destination."
never = "An analytics script that reads form fields."
applies = ["web"]
when = ["surface:template", "surface:client-script"]
who = ["human", "det"]
block = "web"
absorb = "partial"
held_by = "platform:ingress"
phase = "build"
values = ["trackers"]
check = ["blocks", "probe:headers"]
asvs = ["14.2.3"]
cwe = ["359"]

[[rule]]
id = "RETENTION"
do = "Delete records past @retention_days with a scheduled purge."
never = "Keep personal data forever by default."
applies = ["database"]
when = ["surface:data-model", "surface:background-job"]
who = ["human", "det"]
block = ""
absorb = "none"
held_by = "code"
phase = "run"
values = ["retention_days"]
wire = ["test:purge"]
check = ["test:purge", "human"]
asvs = ["14.2.7"]
cwe = []

[[rule]]
id = "CLIENT-STORAGE"
do = "Keep only the session cookie and non-sensitive preferences in the browser, through the storage helper."
never = "Tokens or @sensitive fields in localStorage, sessionStorage or IndexedDB."
applies = ["web"]
when = ["construct:browser-storage"]
who = ["det"]
block = "front"
absorb = "full"
held_by = "code:front"
phase = "build"
values = ["sensitive"]
check = ["blocks"]
asvs = ["14.3.3"]
cwe = ["922"]
js_ok = '''prefs.set("theme", "dark")'''
js_no = '''localStorage.setItem("token", token)'''
