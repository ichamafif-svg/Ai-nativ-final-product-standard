[project]
name = "standard-blocks"
version = "0.2.0"
description = "Standard's building blocks for Python products: the rules hold by using the block."
requires-python = ">=3.11"
license = { text = "Standard's licence" }
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "cryptography>=42",
  "defusedxml>=0.7",
  "jinja2>=3.1",
  "markupsafe>=2.1",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
data = ["SQLAlchemy>=2"]
store = ["redis>=5"]          # sessions and rate limits shared by several workers (STANDARD_STORE_URL)
regex = ["regex>=2024.4"]     # a time limit on every pattern match

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["standard_blocks"]
