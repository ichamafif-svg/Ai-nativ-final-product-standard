# What a rule may name. Every term is detected deterministically by engine/verification/surfaces.py from the repository (a
# feature: the product has it at all) or from a change (a surface or a construct the change adds or touches).
# A term with no detector is refused by the catalog's own test.

[features]
web = "serves HTTP to browsers: an ASGI/WSGI app with HTML responses or cookies"
api = "serves HTTP: an ASGI/WSGI app (FastAPI, Starlette, Flask, Django, Express)"
oidc = "users sign in: an OpenID Connect relying party (the identity provider authenticates)"
upload = "accepts files: UploadFile, multipart parsing, request.files"
crypto = "uses cryptography beyond TLS: encryption, signatures, MACs, key derivation"
outbound-http = "calls other services over HTTP"
database = "talks to a database: an ORM, a DB-API driver, migrations"
xml = "parses XML"
ldap = "queries LDAP"
latex = "runs a LaTeX processor"
csv-export = "writes CSV or spreadsheet files for users"
rich-content = "accepts HTML, SVG, Markdown or CSS from users"
graphql = "serves GraphQL"
websocket = "serves WebSockets"
webrtc = "relays or serves WebRTC media"
multitenant = "serves several tenants from one deployment: a tenant id on models"
mtls = "authenticates clients by TLS certificate"
jwt = "issues or accepts self-contained tokens (JWT, PASETO)"
oauth-client = "calls an OAuth/OIDC authorization server as a client"
resource-server = "accepts OAuth access tokens"
high-value = "the rules of the game list operations in @high_value"
adaptive = "authorization reads context (time, place, device)"
admin = "has an administrative interface"
concurrency = "shares mutable state between threads or processes"
"lang:python" = "Python source"
"lang:js" = "JavaScript or TypeScript source"
"lang:java" = "Java or Kotlin source"
"lang:c" = "C or C++ source"

[surfaces]
endpoint = "an HTTP route (method + path)"
upload-endpoint = "a route that receives a file"
form = "an HTML form"
cookie = "a cookie the app sets"
template = "a server-side template"
outbound-call = "a call to another service"
data-model = "a persisted model or table"
migration = "a database migration"
log-call = "a logging statement"
config = "a setting read from the environment or a file"
dependency = "a third-party package"
background-job = "a scheduled or queued job"
websocket-endpoint = "a WebSocket route"
graphql-schema = "a GraphQL type or resolver"
client-script = "a script that runs in the browser"

[constructs]
sql-call = "a call that sends SQL text: execute, raw, text()"
subprocess = "starts a process: subprocess, os.system, child_process"
dynamic-code = "eval, exec, compile, Function(), dynamic import"
template-build = "a template created from a string at runtime"
html-output = "HTML built or marked safe in code"
url-build = "a URL assembled from values"
regex = "a regular expression built or applied to input"
xml-parse = "an XML parser call"
deserialize = "pickle, marshal, yaml.load, a binary deserializer"
file-path = "a filesystem path built from values"
archive = "zip, tar or gzip extraction"
cipher = "an encryption or decryption call"
hash = "a hash or MAC call"
random = "a random value generated"
secret-compare = "a comparison of secrets, tokens or MACs"
token-decode = "a JWT or token decoded or verified"
http-client = "an HTTP client call"
cookie-set = "a cookie set on a response"
redirect = "a redirect response"
header-read = "a request header read (forwarded, real IP, host)"
postmessage = "window.postMessage or a message listener"
browser-storage = "localStorage, sessionStorage, IndexedDB"
format-string = "a format string built from values"
mail-send = "an e-mail sent"
ldap-query = "an LDAP search"
xpath-query = "an XPath evaluation"
csv-write = "a CSV row written"
debug-flag = "a debug or reload flag"
env-read = "an environment variable read"
lock = "a lock, transaction or atomic block"
thread = "a thread, process pool or task spawned"
log-write = "a log statement with values"
response-model = "a route returning a model or a dict"
request-body = "a route reading a request body or query"
tls-context = "a TLS context or verify flag"
