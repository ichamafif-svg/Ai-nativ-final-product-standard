name: bac
# The bac's walls measured on a pure cgroup v2 host, as an ordinary user with delegated cgroups
# and as root (control groups). The local development host mixes cgroup v1 and v2; this is where v2 is qualified.
# `gvisor` installs runsc, which the bac then takes first: the same walls, measured under gVisor's user-space kernel.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  walls:
    runs-on: ubuntu-24.04
    env:
      STANDARD_COMPONENTS: /tmp/standard-components-ci      # the same pinned components for user and root
    strategy:
      fail-fast: false
      matrix:
        as: [user, root, gvisor]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q runc crun bubblewrap
      - name: gVisor (runsc) from its signed repository
        if: matrix.as == 'gvisor'
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -q && sudo apt-get install -y -q runsc
      # The data wall needs PostgreSQL 16 with PL/Python; without it the data tests and walls say so (skipped, unmeasured).
      - run: sudo apt-get install -y -q postgresql-16 postgresql-plpython3-16 || echo "no PL/Python on this runner"
      - run: test -f /sys/fs/cgroup/cgroup.controllers   # a pure cgroup v2 host, or this job is not qualifying anything
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; a rootless runtime needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: delegate a bounded cgroup subtree to the ordinary runtime user
        if: matrix.as == 'user'
        run: |
          sudo useradd -M -s /usr/sbin/nologin standard-guard
          sudo useradd -M -s /usr/sbin/nologin -G standard-guard standard-agent
          sudo useradd -M -s /usr/sbin/nologin standard-runner
          sudo install -D -o root -g root -m 0755 tools/cgroup_run.sh /usr/local/libexec/standard-cgroup-run
          sudo bash tools/cgroup_setup.sh
      - run: pip install --require-hashes -r requirements.hashes
      - run: python -m tools.components fetch                 # Envoy, oauth2-proxy, OpenBao, checked against their pins
      - name: walls and bac tests as an ordinary user
        if: matrix.as == 'user'
        run: |
          sudo install -d -m 0755 /tmp/standard-user-code
          git archive HEAD | sudo tar -x -C /tmp/standard-user-code
          cd /tmp/standard-user-code
          sudo /usr/local/libexec/standard-cgroup-run standard-agent env "STANDARD_COMPONENTS=$STANDARD_COMPONENTS" "PATH=$PATH" python -m engine.verification.walls | tee "$GITHUB_WORKSPACE/walls.json"
          sudo /usr/local/libexec/standard-cgroup-run standard-agent env "STANDARD_COMPONENTS=$STANDARD_COMPONENTS" "PATH=$PATH" python -m unittest discover -s tests -p 'test_enclosure.py' -v
          sudo /usr/local/libexec/standard-cgroup-run standard-agent env "STANDARD_COMPONENTS=$STANDARD_COMPONENTS" "PATH=$PATH" python -m unittest discover -s tests -p 'test_refusals.py' -v
          sudo /usr/local/libexec/standard-cgroup-run standard-agent env "STANDARD_COMPONENTS=$STANDARD_COMPONENTS" "PATH=$PATH" python -m unittest discover -s tests -p 'test_gateway.py' -v
          sudo /usr/local/libexec/standard-cgroup-run standard-agent env "STANDARD_COMPONENTS=$STANDARD_COMPONENTS" "PATH=$PATH" python -m unittest discover -s tests -p 'test_platform.py' -v
      - name: compromise, revoke and reconstruct the enclosed agent
        if: matrix.as == 'user'
        run: |
          cd /tmp/standard-user-code
          sudo /usr/local/libexec/standard-cgroup-run standard-agent unshare -Urn /usr/bin/true
          sudo -E env "PATH=$PATH" STANDARD_AGENT_NATIVE=1 python -W error::ResourceWarning -m unittest discover -s tests -p 'test_agent_enclosure.py' -v
      - name: walls and bac tests as root, with control groups
        if: matrix.as == 'root'
        run: |
          sudo -E env "PATH=$PATH" python -m engine.verification.walls | tee "$GITHUB_WORKSPACE/walls.json"
          sudo -E env "PATH=$PATH" python -m unittest discover -s tests -p 'test_enclosure.py' -v
          sudo -E env "PATH=$PATH" python -m unittest discover -s tests -p 'test_refusals.py' -v
          test -x /usr/lib/postgresql/16/bin/postgres
          sudo -E env "PATH=$PATH" python -m unittest discover -s tests -p 'test_cartography.py' -v
          sudo -E env "PATH=$PATH" python -m tools.platform_walls
      - name: walls under gVisor, as root
        if: matrix.as == 'gvisor'
        run: |
          sudo -E env "PATH=$PATH" python -c "from fabric.runtime.bac import Bac; b = Bac(); print(b.runtime, b.why); assert b.ready and b.runtime.endswith('runsc')"
          sudo -E env "PATH=$PATH" python -m engine.verification.walls | tee "$GITHUB_WORKSPACE/walls.json"
          sudo -E env "PATH=$PATH" python -m unittest discover -s tests -p 'test_enclosure.py' -v
      - name: every measured wall holds
        run: |
          python - <<'EOF'
          import json
          walls = json.load(open("walls.json"))
          broken = sorted(w for w, s in walls.items() if s in ("broken", "unmeasured") and w != "cgroups")
          print(walls)
          assert not broken, f"walls not held: {broken}"
          EOF
