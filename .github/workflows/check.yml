name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.hashes
      - run: make check
      - run: STANDARD_DIFFERENTIAL=200 python -m unittest discover -s tests -p test_differential.py
  egress-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m venv /tmp/egress-tests
      - run: /tmp/egress-tests/bin/pip install --require-hashes -r fabric/supply_chain/egress-requirements.txt
      - run: /tmp/egress-tests/bin/python -W error::ResourceWarning -m unittest discover -s tests -p test_fabric_adversarial.py -v
