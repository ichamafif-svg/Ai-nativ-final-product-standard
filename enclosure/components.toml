# The platform's components (D68): reused, never rewritten, pinned in the release by exact version and digest.
# `python -m tools.components fetch [DIR]` downloads each archive, checks its digest before unpacking, then checks
# the binary's digest; a mismatch installs nothing. Standard writes the policy; these are the mechanisms.

